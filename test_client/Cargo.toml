[package]
name = "test_client"
version = "0.1.0"
authors = ["Robin Appelman <robin@icewind.nl>"]
edition = "2018"

[dependencies]
base64 = "0.23.0"
flexi_logger = { version = "0.31.9", features = ["colors"] }
log = "0.4.33"
miette = { version = "7.6.0", features = ["fancy"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde_json = "1.0.150"
tungstenite = { version = "0.30.0", features = [
  "rustls-tls-native-roots",
  "url"
] }
ureq = { version = "3.3.0", default-features = false, features = [
  "gzip",
  "platform-verifier",
  "rustls-no-provider"
] }
url = "2.5.8"
